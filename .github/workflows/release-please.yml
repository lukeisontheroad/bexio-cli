name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          release-type: simple

  # Tags pushed with the default GITHUB_TOKEN do not trigger workflows, so the
  # release build is chained onto this run instead of waiting for a tag event.
  # That keeps releases fully automatic without a long-lived PAT.
  goreleaser:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
    secrets: inherit
    with:
      ref: ${{ needs.release-please.outputs.tag_name }}
