name: release

# Normally invoked by the release-please workflow (workflow_call) right after
# it cuts a release, because tags pushed with the default GITHUB_TOKEN do not
# themselves trigger workflows (GitHub anti-recursion rule). The tag trigger
# below therefore only fires for tags pushed by a human, and
# workflow_dispatch stays as a manual re-run escape hatch.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag to build (defaults to the checked-out ref)"
        required: false
        type: string
  workflow_call:
    inputs:
      ref:
        description: "Tag the release was cut at"
        required: true
        type: string

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # For workflow_call/dispatch the caller passes the tag; a direct
          # tag push already checks out the right ref.
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PAT with repo scope on lukeisontheroad/homebrew-tap, set as repo secret:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
